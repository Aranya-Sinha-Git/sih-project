name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r 01-app/backend/requirements.txt
      - name: Run backend tests
        working-directory: 01-app/backend
        run: python -m pytest -q tests
      - name: Run frozen evaluation tests
        run: python -m pytest -q 03-training/ml/sif_v0_1/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 01-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
